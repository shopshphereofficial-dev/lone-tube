name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34 (if missing)
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: base64 -d keystore.b64 > app/lonetube.p12

      - name: Build release APK (R8 minified)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LoneTube-v1.1.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoneTube-apk
          path: LoneTube-v1.1.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1 > /dev/null 2>&1; then
            gh release upload v1.1 LoneTube-v1.1.apk --clobber
          else
            gh release create v1.1 LoneTube-v1.1.apk \
              --title "LoneTube v1.1" \
              --notes "Smaller (R8-minified), WhatsApp status saver, SnapTube-style Google browser and Aloha-style video detection on any website."
          fi
