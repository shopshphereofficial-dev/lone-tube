name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34 (if missing)
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: base64 -d keystore.b64 > app/soulstream.p12

      - name: Build release APK (shrunk, names kept)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SoulStream-v2.5.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulStream-apk
          path: SoulStream-v2.5.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.5 > /dev/null 2>&1; then
            gh release upload v2.5 SoulStream-v2.5.apk --clobber
          else
            gh release create v2.5 SoulStream-v2.5.apk \
              --title "SoulStream v2.5" \
              --notes "Browser fixed: pages now render (the WebView gets its own slot instead of sitting under a full-screen Compose overlay, and uses a real Chrome user-agent). Stronger ad blocking - bigger host list, pop-up/new-window blocking, and DOM ad-removal. In-app ad-free YouTube: auto-skips and hides ads, plus an AD-FREE chip to open the current video on a mirror. Image links are now detected and saved to the gallery instead of showing video/audio formats and failing. Adds Share/Feedback in Settings."
          fi
