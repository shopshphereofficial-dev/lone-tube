name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34 (if missing)
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: base64 -d keystore.b64 > app/soulstream.p12

      - name: Build release APK (shrunk, names kept)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SoulStream-v2.4.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulStream-apk
          path: SoulStream-v2.4.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.4 > /dev/null 2>&1; then
            gh release upload v2.4 SoulStream-v2.4.apk --clobber
          else
            gh release create v2.4 SoulStream-v2.4.apk \
              --title "SoulStream v2.4" \
              --notes "Engine fix. The APK now ships the yt-dlp/ffmpeg/aria2c native binaries for every ABI (arm64-v8a, armeabi-v7a, x86, x86_64) instead of arm64 only, and the release build is no longer minified - R8 was breaking the engine's reflection-based class loading, which is why the engine could fail to load in the installed (release) build. extractNativeLibs is pinned true so the engine binaries are always unpacked. Version shown in Settings now matches the build."
          fi
