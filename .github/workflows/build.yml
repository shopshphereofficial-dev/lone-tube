name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34 (if missing)
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LoneTube-v1.0.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoneTube-apk
          path: LoneTube-v1.0.apk

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 LoneTube-v1.0.apk \
            --title "LoneTube v1.0" \
            --notes "Premium media downloader powered by yt-dlp. YouTube, Instagram, Facebook and 1000+ sites in original quality. Turbo downloads (aria2c), quality picker, in-app browser with login, downloads library, animated premium UI. Personal use of your own content only." \
            || gh release upload v1.0 LoneTube-v1.0.apk --clobber
