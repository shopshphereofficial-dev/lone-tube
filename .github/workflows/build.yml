name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34 (if missing)
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: base64 -d keystore.b64 > app/soulstream.p12

      - name: Build release APK (shrunk, names kept)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SoulStream-v2.3.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulStream-apk
          path: SoulStream-v2.3.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.3 > /dev/null 2>&1; then
            gh release upload v2.3 SoulStream-v2.3.apk --clobber
          else
            gh release create v2.3 SoulStream-v2.3.apk \
              --title "SoulStream v2.3" \
              --notes "Downloads no longer depend on the aria2c turbo engine alone: if that pass fails the download is retried with yt-dlp's own downloader. minSdk lowered to Android 8 so it installs on older phones. Everything from v2.2: engine errors shown with one-tap repair, diagnostics report, browser retry + Open in Chrome."
          fi
