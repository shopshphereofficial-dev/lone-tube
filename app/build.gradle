plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.soulstream.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.soulstream.app"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "2.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            // Required by the yt-dlp engine: its binaries live in jniLibs and
            // must be extracted so they can be executed.
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        create("release") {
            // Stable key (committed as base64) so every future update installs
            // cleanly over the previous build.
            storeFile file("soulstream.p12")
            storePassword "soulstream2026"
            keyAlias "soulstream"
            keyPassword "soulstream2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            // Shrink hard (that is where the 50+ MB of dead code went) but keep
            // class names intact - no obfuscation, so nothing can break at runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.getByName("release")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'
}
