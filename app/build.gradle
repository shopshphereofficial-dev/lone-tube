plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lonetube.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lonetube.app"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            // Required by the yt-dlp engine: the binaries live in jniLibs and
            // must be extracted so they can be executed.
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        create("release") {
            // A stable key is committed (base64) so every future update
            // installs cleanly over the previous version.
            storeFile file("lonetube.p12")
            storePassword "lonetube2026"
            keyAlias "lonetube"
            keyPassword "lonetube2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            // R8 strips unused code and resources - this is what keeps the
            // download small (the debug build carried ~56 MB of dead dex).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.getByName("release")
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'
}
